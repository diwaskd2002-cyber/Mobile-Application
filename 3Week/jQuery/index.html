<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>jQuery Profile Card</title>

  <!-- jQuery CDN -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:30px;
      color:white;
    }

    h1{
      margin-bottom:20px;
      color:#38bdf8;
      letter-spacing:2px;
      text-align:center;
    }

    #profile-card{
      width:380px;
      background:#1e293b;
      border-radius:20px;
      padding:25px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
      transition:0.4s;
      border:2px solid #38bdf8;
    }

    #profile-photo{
      width:140px;
      height:140px;
      object-fit:cover;
      border-radius:15px;
      border:4px solid #38bdf8;
      transition:0.4s;
      margin-bottom:15px;
    }

    h2{
      color:#facc15;
      margin-bottom:10px;
      font-size:28px;
    }

    #student-bio{
      color:#cbd5e1;
      margin-bottom:15px;
      line-height:1.5;
    }

    #skills-list{
      list-style:none;
      margin-top:15px;
    }

    #skills-list li{
      background:#334155;
      margin:8px 0;
      padding:10px;
      border-radius:10px;
      color:#e2e8f0;
    }

    .controls{
      margin-top:25px;
      width:90%;
      max-width:1000px;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:10px;
    }

    button{
      padding:10px 15px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      background:#38bdf8;
      color:#0f172a;
      font-weight:bold;
      transition:0.3s;
    }

    button:hover{
      background:#0ea5e9;
      transform:scale(1.05);
    }

    #nickname-input{
      padding:10px;
      border:none;
      border-radius:10px;
      width:220px;
      outline:none;
    }

    #output{
      margin-top:25px;
      background:#0f172a;
      border:2px solid #38bdf8;
      padding:15px;
      border-radius:12px;
      width:80%;
      max-width:700px;
      text-align:center;
      color:#f8fafc;
      font-size:18px;
    }

    .highlighted{
      border:3px solid #facc15;
      transform:scale(1.03);
    }

    .dark-mode{
      background:#000;
      color:white;
    }

    .rounded{
      border-radius:50%;
    }

    .shadow{
      box-shadow:0 0 25px #38bdf8;
    }
  </style>
</head>

<body>

  <h1>✨ jQuery Interactive Profile Card</h1>

  <div id="profile-card">

    <img 
      id="profile-photo"
      src="images/photo.jpg"
      alt="Profile Photo"
    >

    <h2 id="student-name">Diwas Khadka</h2>

    <p id="student-bio">
      Hello! My name is Diwas. I am passionate about web development,
      JavaScript, jQuery, and creating interactive websites.
    </p>

    <input type="text" id="nickname-input" placeholder="Enter nickname">

    <ul id="skills-list">
      <li>HTML & CSS</li>
      <li>JavaScript & jQuery</li>
      <li>Responsive Design</li>
      <li>UI/UX Creativity</li>
    </ul>

  </div>

  <!-- ALL BUTTONS IN SEQUENCE -->
  <div class="controls">

    <button id="show-name">Show Name</button>
    <button id="change-name">Change Name</button>
    <button id="show-bio">Show Bio</button>
    <button id="get-input">Get Input</button>
    <button id="set-input">Set Input</button>

    <button id="highlight-card">Highlight Card</button>
    <button id="remove-highlight">Remove Highlight</button>
    <button id="toggle-dark">Toggle Dark</button>
    <button id="toggle-rounded">Toggle Rounded</button>

    <button id="red-bg">Red Background</button>
    <button id="reset-bg">Reset Background</button>

    <button id="hide-photo">Hide Photo</button>
    <button id="show-photo">Show Photo</button>
    <button id="toggle-bio">Toggle Bio</button>

    <button id="fade-out">Fade Out Card</button>
    <button id="fade-in">Fade In Card</button>
    <button id="fade-half">Fade to 50%</button>

    <button id="slide-up">Slide Up Skills</button>
    <button id="slide-down">Slide Down Skills</button>
    <button id="slide-toggle">Slide Toggle Skills</button>

    <button id="animate-card">Animate Card</button>

  </div>

  <div id="output">
    ✨ Output will appear here...
  </div>

  <script>
    $(document).ready(function () {

      // GET & SET

      $("#show-name").click(function () {
        var name = $("#student-name").text();
        $("#output").text(name);
      });

      $("#change-name").click(function () {
        $("#student-name").text("Diwas");
      });

      $("#show-bio").click(function () {
        var bio = $("#student-bio").html();
        $("#output").text(bio);
      });

      $("#get-input").click(function () {
        var value = $("#nickname-input").val();
        $("#output").text("Nickname: " + value);
      });

      $("#set-input").click(function () {
        $("#nickname-input").val("Diwas");
        $("#output").text("Input set to: Diwas");
      });

      // CSS CLASSES

      $("#highlight-card").click(function () {
        $("#profile-card").addClass("highlighted");
        $("#output").text("Class 'highlighted' ADDED.");
      });

      $("#remove-highlight").click(function () {
        $("#profile-card").removeClass("highlighted");
        $("#output").text("Class 'highlighted' REMOVED.");
      });

      $("#toggle-dark").click(function () {
        $("#profile-card").toggleClass("dark-mode");
        $("#output").text("Dark mode TOGGLED.");
      });

      $("#toggle-rounded").click(function () {
        $("#profile-photo").toggleClass("rounded");
        $("#output").text("Rounded class TOGGLED on photo.");
      });

      // CSS METHOD

      $("#red-bg").click(function () {
        $("#profile-card").css("background", "#dc2626");
        $("#output").text("Background changed to RED.");
      });

      $("#reset-bg").click(function () {
        $("#profile-card").css("background", "#1e293b");
        $("#output").text("Background reset.");
      });

      // HIDE & SHOW

      $("#hide-photo").click(function () {
        $("#profile-photo").hide("slow");
        $("#output").text("Photo HIDDEN.");
      });

      $("#show-photo").click(function () {
        $("#profile-photo").show("slow");
        $("#output").text("Photo SHOWN.");
      });

      $("#toggle-bio").click(function () {
        $("#student-bio").toggle();
        $("#output").text("Bio TOGGLED.");
      });

      // FADE

      $("#fade-out").click(function () {
        $("#profile-card").fadeOut();
        $("#output").text("Card FADED OUT.");
      });

      $("#fade-in").click(function () {
        $("#profile-card").fadeIn();
        $("#output").text("Card FADED IN.");
      });

      $("#fade-half").click(function () {
        $("#profile-card").fadeTo("slow", 0.5);
        $("#output").text("Card faded to 50% opacity.");
      });

      // SLIDE

      $("#slide-up").click(function () {
        $("#skills-list").slideUp();
        $("#output").text("Skills list SLID UP.");
      });

      $("#slide-down").click(function () {
        $("#skills-list").slideDown();
        $("#output").text("Skills list SLID DOWN.");
      });

      $("#slide-toggle").click(function () {
        $("#skills-list").slideToggle();
        $("#output").text("Skills list TOGGLED.");
      });

      // ANIMATE

      $("#animate-card").click(function () {
        $("#profile-card")
          .animate({ marginLeft: "200px" }, 1000)
          .animate({ marginLeft: "0px" }, 1000);

        $("#output").text("Card animated successfully.");
      });

      // EVENTS

      $("#profile-photo").mouseenter(function () {
        $(this).addClass("shadow");
      });

      $("#profile-photo").mouseleave(function () {
        $(this).removeClass("shadow");
      });

      $("#nickname-input").keypress(function (event) {
        $("#output").text("Key pressed: " + event.key);
      });

    });
  </script>

</body>
</html>
